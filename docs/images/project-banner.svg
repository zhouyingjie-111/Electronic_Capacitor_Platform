    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2773db"/><stop offset="1" stop-color="#6988e8"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d5e3f7" stroke-width="0.6"/></pattern>
  </defs>
  <rect width="1200" height="310" rx="22" fill="url(#bg)"/>
  <path d="M760 0H1200V310H760Z" fill="url(#grid)" opacity="0.8"/>
  <circle cx="1136" cy="24" r="190" fill="#dbe8ff" opacity="0.5"/>
