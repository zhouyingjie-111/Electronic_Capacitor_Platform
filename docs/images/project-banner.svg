<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">AI + Power Electronics Platform</title>
  <desc id="desc">A local research platform for transient current tracking and capacitor parameter identification. Data, learning, simulation and monitoring.</desc>
  <defs>
