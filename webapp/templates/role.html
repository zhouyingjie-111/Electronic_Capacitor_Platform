<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>欢迎使用 · 双通道互济型电子电容</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px 24px; background: #ffffff; color: #1a1a1a; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    main { width: min(960px, 100%); text-align: center; }
    h1 { margin: 0 0 24px; font-size: clamp(24px, 3.6vw, 36px); font-weight: 700; line-height: 1.65; letter-spacing: 1px; }
    p { margin: 0 0 32px; color: #666; font-size: 18px; line-height: 1.7; }
    button { padding: 13px 38px; border: 0; border-radius: 10px; background: #3a86ff; color: #fff; font: inherit; font-size: 17px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #236de0; }
    button:focus-visible { outline: 3px solid #86b4ff; outline-offset: 4px; }
  </style>
  <link rel="stylesheet" href="{{ url_for('project.static', filename='typography.css') }}">
</head>
<body>
  <main>
    <h1>双通道互济型电子电容智能控制与监测平台</h1>
    <p>欢迎使用，开启智能控制与监测</p>
    <form method="post" action="{{ url_for('role_set') }}">
      <button type="submit">进入平台</button>
    </form>
  </main>
</body>
</html>
